services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intertool
      POSTGRES_USER: intertool
      POSTGRES_PASSWORD: intertool
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intertool -d intertool"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - intertool-postgres:/var/lib/postgresql/data

volumes:
  intertool-postgres:
