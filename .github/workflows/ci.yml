name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: intertool
          POSTGRES_USER: intertool
          POSTGRES_PASSWORD: intertool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intertool -d intertool"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://intertool:intertool@localhost:5432/intertool
      AUTH_SECRET: ci-only-secret
      WEB_INTERNAL_SECRET: ci-only-internal-secret
      DEV_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
